name: CI

# check runs on every push to main and every pull request.
# deploy ships main to production after check passes. Run the workflow by hand on main to
# rebuild and redeploy (for example after changing the PUBLIC_CF_ANALYTICS_TOKEN variable).
# preview publishes a Worker Preview per pull request; preview-cleanup deletes it on close.
# See docs/adr/0002-workers-via-actions.md.
#
# Concurrency:
# - main (push or manual run) shares one group and is never cancelled, so a deploy is never cut
#   off. At most one newer run waits behind the one in progress.
# - Pull request runs for opened/synchronize/reopened share pr-<n> and supersede each other.
# - A closed event gets a group of its own. For a merged PR github.ref is the base branch, so it
#   must not share a ref-based group with main. Nothing cancels it.
# - The preview and preview-cleanup jobs also share preview-pr-<n> without cancellation, so cleanup
#   waits for an in-flight preview to finish instead of racing it. The preview job re-checks that
#   the PR is still open before publishing.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ${{
      github.event_name != 'pull_request'
        && (github.ref == 'refs/heads/main' && 'deploy-production' || format('ci-{0}', github.ref))
        || github.event.action == 'closed'
          && format('pr-{0}-closed-{1}', github.event.pull_request.number, github.run_id)
          || format('pr-{0}', github.event.pull_request.number)
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Read by the Astro build; the analytics beacon is omitted when this is empty.
      PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_ANALYTICS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm exec biome ci .
      - name: Type check
        run: pnpm check
      - name: Resume schema is up to date
        run: |
          pnpm gen:schema
          git diff --exit-code src/data/resume/schema.json
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Keep the build for deploy and preview
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serialised by the workflow-level deploy-production group above.
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Installs the project's pinned wrangler, which wrangler-action then uses.
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  preview:
    # Fork and Dependabot PRs cannot read the Cloudflare secrets, so they get checks only.
    if: >-
      github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
    steps:
      - name: Skip when Cloudflare secrets are missing
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping the preview."
      # The event payload always says "open"; ask again in case the PR closed while check ran.
      - name: Check the pull request is still open
        id: pr
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          state="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if [[ "$state" != "OPEN" ]]; then
            echo "::notice::PR #$PR_NUMBER is $state; skipping the preview."
          fi
      - if: steps.pr.outputs.state == 'OPEN'
        uses: actions/checkout@v7
      - if: steps.pr.outputs.state == 'OPEN'
        uses: pnpm/action-setup@v6
      - if: steps.pr.outputs.state == 'OPEN'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.pr.outputs.state == 'OPEN'
        run: pnpm install --frozen-lockfile
      - if: steps.pr.outputs.state == 'OPEN'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Deploy Worker Preview
        id: preview
        if: steps.pr.outputs.state == 'OPEN'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: preview --name ${{ env.PREVIEW_NAME }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Comment the preview URL
        if: steps.pr.outputs.state == 'OPEN'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
          DEPLOYMENT_URL: ${{ steps.preview.outputs.preview-deployment-url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ -z "$PREVIEW_URL" ]]; then
            echo "::warning::wrangler returned no preview URL; check preview_urls in wrangler.jsonc has been deployed from main."
            body="$(printf '**Preview:** deployed (%s), but Cloudflare returned no URL; preview_urls must be deployed from main first.\n' "${SHA:0:7}")"
          else
            body="$(printf '**Preview:** %s\n\nThis deployment (%s): %s\n' \
              "$PREVIEW_URL" "${SHA:0:7}" "$DEPLOYMENT_URL")"
          fi
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --edit-last --create-if-none --body "$body"

  preview-cleanup:
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Shared with the preview job: waits for an in-flight preview, and is never cancelled.
    concurrency:
      group: preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
    steps:
      - if: env.HAS_CLOUDFLARE == 'true'
        uses: actions/checkout@v7
      - if: env.HAS_CLOUDFLARE == 'true'
        uses: pnpm/action-setup@v6
      - if: env.HAS_CLOUDFLARE == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: env.HAS_CLOUDFLARE == 'true'
        run: pnpm install --frozen-lockfile
      - name: Delete Worker Preview
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # A PR whose preview was never created (secrets were added later, or the PR closed before
        # the preview ran) has nothing to delete: that counts as success. Anything else is retried
        # with backoff and then fails the job.
        run: |
          for attempt in 1 2 3 4; do
            if output="$(pnpm exec wrangler preview delete --name "$PREVIEW_NAME" --skip-confirmation 2>&1)"; then
              echo "$output"
              exit 0
            fi
            echo "$output"
            if grep -qiE 'not found|does not exist|no preview|status: 404' <<<"$output"; then
              echo "::notice::Preview $PREVIEW_NAME does not exist; nothing to delete."
              exit 0
            fi
            if (( attempt < 4 )); then
              delay=$(( 5 * 2 ** (attempt - 1) ))
              echo "::warning::Deleting $PREVIEW_NAME failed (attempt $attempt); retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          echo "::error::Could not delete Worker Preview $PREVIEW_NAME after 4 attempts."
          exit 1
