name: CI

# check runs on every push to main and every pull request.
# deploy ships main to production after check passes. Run the workflow by hand on main to
# rebuild and redeploy (for example after changing the PUBLIC_CF_ANALYTICS_TOKEN variable).
# preview publishes a Worker Preview per pull request; preview-cleanup deletes it on close.
# See docs/adr/0002-workers-via-actions.md.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Supersede stale PR runs; let every push to main finish so deploys are never cut off.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Read by the Astro build; the analytics beacon is omitted when this is empty.
      PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_ANALYTICS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm exec biome ci .
      - name: Type check
        run: pnpm check
      - name: Resume schema is up to date
        run: |
          pnpm gen:schema
          git diff --exit-code src/data/resume/schema.json
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Keep the build for deploy and preview
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Installs the project's pinned wrangler, which wrangler-action then uses.
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  preview:
    # Fork and Dependabot PRs cannot read the Cloudflare secrets, so they get checks only.
    if: >-
      github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
    steps:
      - name: Skip when Cloudflare secrets are missing
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping the preview."
      - if: env.HAS_CLOUDFLARE == 'true'
        uses: actions/checkout@v7
      - if: env.HAS_CLOUDFLARE == 'true'
        uses: pnpm/action-setup@v6
      - if: env.HAS_CLOUDFLARE == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: env.HAS_CLOUDFLARE == 'true'
        run: pnpm install --frozen-lockfile
      - if: env.HAS_CLOUDFLARE == 'true'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Deploy Worker Preview
        id: preview
        if: env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: preview --name ${{ env.PREVIEW_NAME }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Comment the preview URL
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
          DEPLOYMENT_URL: ${{ steps.preview.outputs.preview-deployment-url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body="$(printf '**Preview:** %s\n\nThis deployment (%s): %s\n' \
            "$PREVIEW_URL" "${SHA:0:7}" "$DEPLOYMENT_URL")"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --edit-last --create-if-none --body "$body"

  preview-cleanup:
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
    steps:
      - if: env.HAS_CLOUDFLARE == 'true'
        uses: actions/checkout@v7
      - if: env.HAS_CLOUDFLARE == 'true'
        uses: pnpm/action-setup@v6
      - if: env.HAS_CLOUDFLARE == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: env.HAS_CLOUDFLARE == 'true'
        run: pnpm install --frozen-lockfile
      - name: Delete Worker Preview
        if: env.HAS_CLOUDFLARE == 'true'
        # A PR whose preview was never created (secrets were added later) has nothing to delete.
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: preview delete --name ${{ env.PREVIEW_NAME }} --skip-confirmation
